<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Experience Pool — Console</title>
<style>
  :root {
    --bg: #0b0d12; --bg-elev: #11141b; --bg-card: #161a23;
    --border: #232734; --border-soft: #1c2030;
    --fg: #e6e8ee; --fg-dim: #9097a8; --fg-mute: #6a7184;
    --accent: #7c9cff; --accent-2: #5eead4; --accent-3: #f6c177;
    --danger: #f47174; --ok: #4ade80; --warn: #fbbf24;
    --code-bg: #0e1117;
    --grad: linear-gradient(135deg, #7c9cff 0%, #5eead4 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex; min-height: 100vh;
  }
  code, pre, .mono { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Sidebar */
  aside.side {
    width: 240px; flex-shrink: 0;
    background: var(--bg-elev); border-right: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
  }
  .brand {
    padding: 22px 20px 18px; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; gap: 10px;
  }
  .brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--grad); }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand-tag { font-size: 10px; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .12em; }
  .nav { padding: 16px 10px; flex: 1; }
  .nav .group { font-size: 10px; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .12em; padding: 14px 10px 6px; }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px;
    border: none; background: transparent; color: var(--fg-dim); font-size: 14px;
    cursor: pointer; border-radius: 8px; text-align: left; font-family: inherit;
    transition: all .15s;
  }
  .nav button:hover { background: var(--bg-card); color: var(--fg); }
  .nav button.active { background: rgba(124,156,255,.10); color: var(--accent); border: 1px solid rgba(124,156,255,.22); }
  .nav button .icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .8; }
  .side-foot {
    padding: 14px 18px; border-top: 1px solid var(--border-soft);
    font-size: 11px; color: var(--fg-mute); display: flex; flex-direction: column; gap: 4px;
  }
  .side-foot .row { display: flex; justify-content: space-between; }
  .side-foot .ok { color: var(--ok); }

  /* Main */
  main { flex: 1; min-width: 0; }
  header.bar {
    padding: 18px 32px; border-bottom: 1px solid var(--border-soft);
    display: flex; align-items: center; gap: 16px;
    background: rgba(11,13,18,.72); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 10;
  }
  header.bar h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header.bar .sub { color: var(--fg-mute); font-size: 13px; }
  header.bar .actions { margin-left: auto; display: flex; gap: 8px; }
  .page { padding: 28px 32px; }

  /* Buttons */
  button.btn {
    border: 1px solid var(--border); background: var(--bg-card); color: var(--fg);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: all .15s;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--grad); color: #0b0d12; border: none; font-weight: 600; }
  button.btn.primary:hover { transform: translateY(-1px); }
  button.btn.danger { color: var(--danger); border-color: rgba(244,113,116,.30); }
  button.btn.danger:hover { background: rgba(244,113,116,.10); border-color: var(--danger); }
  button.btn.ghost { background: transparent; }
  button.btn:disabled { opacity: .5; cursor: not-allowed; }
  button.btn .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 99px; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Cards / grids */
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px;
  }
  .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .card .label { font-size: 11px; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .12em; }
  .card .num {
    font-size: 28px; font-weight: 700; margin-top: 4px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card .sub { font-size: 12px; color: var(--fg-mute); margin-top: 4px; }

  /* Tables */
  table.t {
    width: 100%; border-collapse: collapse; font-size: 13px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  table.t th, table.t td {
    padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-soft);
  }
  table.t th { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--fg-mute); font-weight: 600; background: var(--bg-elev); }
  table.t tr:last-child td { border-bottom: none; }
  table.t tr.row { transition: background .1s; cursor: pointer; }
  table.t tr.row:hover { background: rgba(124,156,255,.04); }
  table.t .mono { color: var(--accent); font-size: 12px; }
  table.t .ellipsis { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Forms */
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; font-weight: 600; }
  .field .hint { font-size: 11px; color: var(--fg-mute); margin-top: 4px; }
  input.in, select.in, textarea.in {
    width: 100%; padding: 9px 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--fg); font-size: 13px; font-family: inherit;
  }
  textarea.in { font-family: "SF Mono", monospace; min-height: 140px; resize: vertical; }
  input.in:focus, select.in:focus, textarea.in:focus { outline: none; border-color: var(--accent); }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

  /* Badges / chips */
  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: rgba(124,156,255,.10); color: var(--accent);
    border: 1px solid rgba(124,156,255,.22); display: inline-flex; align-items: center; gap: 4px;
  }
  .chip.green { background: rgba(94,234,212,.10); color: var(--accent-2); border-color: rgba(94,234,212,.22); }
  .chip.amber { background: rgba(246,193,119,.10); color: var(--accent-3); border-color: rgba(246,193,119,.22); }
  .chip.danger { background: rgba(244,113,116,.10); color: var(--danger); border-color: rgba(244,113,116,.22); }
  .chip.muted { background: var(--bg); color: var(--fg-mute); border-color: var(--border); }

  .review-pending { color: var(--accent-3); }
  .review-approved, .review-auto_approved { color: var(--ok); }
  .review-rejected { color: var(--danger); }

  /* Code */
  pre.code {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; font-size: 12px; line-height: 1.55; overflow-x: auto;
    color: var(--fg-dim);
  }

  /* Toast */
  .toast-wrap { position: fixed; right: 24px; top: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; min-width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: slidein .2s; }
  .toast.ok { border-left: 3px solid var(--ok); }
  .toast.err { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }
  @keyframes slidein { from { transform: translateX(20px); opacity: 0; } }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; max-width: 1100px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 12px; }
  .modal-head h2 { margin: 0; font-size: 16px; }
  .modal-body { padding: 22px; overflow-y: auto; flex: 1; }
  .modal-tabs { display: flex; gap: 4px; padding: 0 22px; border-bottom: 1px solid var(--border-soft); }
  .modal-tab { padding: 10px 14px; cursor: pointer; font-size: 13px; color: var(--fg-mute); border-bottom: 2px solid transparent; }
  .modal-tab.active { color: var(--fg); border-bottom-color: var(--accent); }

  /* Empty state */
  .empty { text-align: center; padding: 60px 20px; color: var(--fg-mute); }
  .empty h3 { color: var(--fg-dim); margin: 0 0 6px; font-weight: 500; }

  /* Misc */
  .row-flex { display: flex; gap: 8px; align-items: center; }
  .spacer { flex: 1; }
  hr { border: none; border-top: 1px solid var(--border-soft); margin: 18px 0; }
  .section-title { font-size: 12px; color: var(--fg-mute); text-transform: uppercase; letter-spacing: .12em; margin: 24px 0 10px; }

  @media (max-width: 900px) {
    aside.side { width: 60px; }
    .brand-name, .brand-tag, .nav .group, .nav button span:not(.icon) { display: none; }
    .nav button { justify-content: center; }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3, .grid-2, .row-2, .row-3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <div class="brand-mark"></div>
    <div>
      <div class="brand-name">Experience Pool</div>
      <div class="brand-tag">Operator Console</div>
    </div>
  </div>
  <nav class="nav" id="nav">
    <div class="group">Pool</div>
    <button data-page="dashboard" class="active"><span class="icon">📊</span><span>Dashboard</span></button>
    <button data-page="experiences"><span class="icon">📦</span><span>Experiences</span></button>
    <button data-page="skills"><span class="icon">🧩</span><span>Skills</span></button>
    <div class="group">Actions</div>
    <button data-page="push"><span class="icon">⬆</span><span>Push 经验</span></button>
    <button data-page="search"><span class="icon">🔍</span><span>Search</span></button>
    <button data-page="upload-skill"><span class="icon">＋</span><span>新建 Skill</span></button>
    <div class="group">Ops</div>
    <button data-page="agents"><span class="icon">👥</span><span>Agents</span></button>
    <button data-page="audit"><span class="icon">📜</span><span>Audit log</span></button>
    <button data-page="settings"><span class="icon">⚙</span><span>Settings</span></button>
  </nav>
  <div class="side-foot">
    <div class="row"><span>Server</span><span id="meta-status" class="ok">connecting…</span></div>
    <div class="row"><span>LLM</span><span id="meta-llm" class="mono">…</span></div>
    <div class="row"><span>Ver</span><span id="meta-version" class="mono">v0.6.0</span></div>
  </div>
</aside>

<main>
  <header class="bar">
    <div>
      <h1 id="page-title">Dashboard</h1>
      <div class="sub" id="page-sub">实时池子状态</div>
    </div>
    <div class="actions" id="page-actions"></div>
  </header>
  <div class="page" id="page-root"></div>
</main>

<div class="toast-wrap" id="toasts"></div>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>

<script>
// ============================================================
// API client
// ============================================================
const api = {
  async get(path) {
    const r = await fetch('/api' + path);
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    return r.json();
  },
  async post(path, body) {
    const r = await fetch('/api' + path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body || {}),
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    return r.json();
  },
};

// ============================================================
// Toasts + helpers
// ============================================================
function toast(msg, kind = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function fmtTs(s) {
  if (!s) return '—';
  const d = typeof s === 'string' ? new Date(s) : new Date(s * 1000);
  if (isNaN(d)) return s;
  return d.toLocaleString('zh-CN', {hour12: false});
}
function fmtBytes(n) {
  if (n == null) return '—';
  const u = ['B','KB','MB','GB'];
  let i = 0, x = n;
  while (x >= 1024 && i < u.length - 1) { x /= 1024; i++; }
  return x.toFixed(1) + ' ' + u[i];
}
function reviewBadge(s) {
  const cls = {pending:'amber', approved:'green', auto_approved:'green', rejected:'danger', edited:'green'}[s] || 'muted';
  return `<span class="chip ${cls}">${s || '—'}</span>`;
}
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function setActions(html) {
  document.getElementById('page-actions').innerHTML = html || '';
}
function setTitle(title, sub) {
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = sub || '';
}

// ============================================================
// Modal
// ============================================================
function openModal(html) {
  const m = document.getElementById('modal');
  m.innerHTML = html;
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }
document.getElementById('modal-bg').addEventListener('click', (e) => {
  if (e.target.id === 'modal-bg') closeModal();
});

// ============================================================
// Pages
// ============================================================
const PAGES = {};

// ---------- Dashboard ----------
PAGES.dashboard = async (root) => {
  setTitle('Dashboard', '实时池子状态');
  setActions(`
    <button class="btn ghost" onclick="renderPage('dashboard')">↻ 刷新</button>
    <button class="btn primary" onclick="seedDemo()">⚡ 灌入演示数据</button>
  `);
  root.innerHTML = '<div class="empty">loading…</div>';
  try {
    const d = await api.get('/dashboard');
    const s = d.stats || {};
    const counts = d.counts || {};
    const review = s.by_review_status || {};
    const sens = s.by_sensitivity || {};
    const tasks = s.by_task_type || {};
    const lb = d.leaderboard || [];

    root.innerHTML = `
      <div class="grid-4">
        <div class="card"><div class="label">Experiences</div><div class="num">${counts.experiences ?? s.total_experiences ?? 0}</div><div class="sub">最近 7 天 +${s.ingestion_last_7_days ?? 0}</div></div>
        <div class="card"><div class="label">Skills</div><div class="num">${counts.skills ?? 0}</div><div class="sub">bundles 已上传</div></div>
        <div class="card"><div class="label">Agents</div><div class="num">${counts.agents ?? 0}</div><div class="sub">注册过的身份</div></div>
        <div class="card"><div class="label">Audit rows</div><div class="num">${counts.audit_log ?? 0}</div><div class="sub">所有状态变更</div></div>
      </div>

      <div class="grid-2" style="margin-top:20px;">
        <div class="card">
          <h3>Review status</h3>
          ${renderKv(review)}
        </div>
        <div class="card">
          <h3>Sensitivity</h3>
          ${renderKv(sens)}
        </div>
      </div>

      <div class="grid-2" style="margin-top:20px;">
        <div class="card">
          <h3>Task types</h3>
          ${renderKv(tasks)}
        </div>
        <div class="card">
          <h3>Disk</h3>
          <div style="display:flex;gap:18px;align-items:baseline;">
            <div style="font-size:24px;font-weight:700;">${(d.disk?.free_percent ?? 0).toFixed(1)}%</div>
            <div style="color:var(--fg-mute);font-size:12px;">free of ${fmtBytes(d.disk?.total_bytes)}</div>
          </div>
          <div style="margin-top:10px;height:6px;background:var(--bg);border-radius:99px;overflow:hidden;">
            <div style="height:100%;width:${100 - (d.disk?.free_percent ?? 0)}%;background:var(--grad);"></div>
          </div>
          <div style="color:var(--fg-mute);font-size:12px;margin-top:8px;">used ${fmtBytes(d.disk?.used_bytes)} · free ${fmtBytes(d.disk?.free_bytes)}</div>
        </div>
      </div>

      <h3 class="section-title">Reuse leaderboard (top 10)</h3>
      ${renderLeaderboard(lb)}

      <h3 class="section-title">Q-scalar 分布</h3>
      ${renderQDistFlat(s)}
    `;
  } catch (err) {
    root.innerHTML = `<div class="empty"><h3>加载失败</h3><div>${escapeHtml(err.message)}</div></div>`;
  }
};

function renderKv(obj) {
  const e = Object.entries(obj || {});
  if (!e.length) return '<div style="color:var(--fg-mute);font-size:13px;">空</div>';
  const max = Math.max(...e.map(([_,v]) => v || 0));
  return e.map(([k, v]) => `
    <div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
      <div style="width:120px;font-size:12px;color:var(--fg-dim);">${escapeHtml(k)}</div>
      <div style="flex:1;height:6px;background:var(--bg);border-radius:99px;overflow:hidden;">
        <div style="height:100%;width:${max ? (v / max * 100) : 0}%;background:var(--grad);"></div>
      </div>
      <div style="width:40px;text-align:right;font-family:monospace;font-size:12px;">${v}</div>
    </div>
  `).join('');
}
function renderLeaderboard(lb) {
  if (!lb || !lb.length) return '<div class="card empty"><h3>暂无数据</h3><div style="color:var(--fg-mute);font-size:12px;">push 经验并被复用后会出现在这里</div></div>';
  return `<table class="t">
    <thead><tr><th>#</th><th>Intent</th><th>Task</th><th>Reuse</th><th>Q</th></tr></thead>
    <tbody>${lb.map((r, i) => `
      <tr class="row" onclick="openExperience('${r.experience_id}')">
        <td class="mono">${i + 1}</td>
        <td class="ellipsis">${escapeHtml(r.intent_text || r.experience_id)}</td>
        <td><span class="chip muted">${escapeHtml(r.task_type || '—')}</span></td>
        <td class="mono">${r.reuse_count}</td>
        <td class="mono">${(r.q_scalar ?? 0).toFixed(3)}</td>
      </tr>`).join('')}
    </tbody></table>`;
}
function renderQDistFlat(s) {
  const rows = [
    ['p50 (Q-scalar)', s.q_scalar_p50],
    ['p90 (Q-scalar)', s.q_scalar_p90],
    ['p10 (judge confidence)', s.judge_confidence_p10],
    ['p50 (judge confidence)', s.judge_confidence_p50],
  ];
  const tiles = rows.map(([k, v]) => `
    <div style="display:flex;flex-direction:column;align-items:center;padding:14px;flex:1;">
      <div style="font-size:10px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:.1em;">${k}</div>
      <div style="font-family:monospace;font-size:22px;font-weight:600;margin-top:4px;">${v != null ? v.toFixed(3) : '—'}</div>
    </div>
  `).join('');
  const hist = s.q_scalar_histogram || [];
  const histHtml = hist.length ? `<div style="margin-top:14px;padding:0 18px 14px;"><div style="font-size:11px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;">Histogram</div>${hist.map(b => {
    const max = Math.max(...hist.map(x => x.count));
    return `<div style="display:flex;align-items:center;gap:10px;margin:3px 0;font-size:11px;"><div class="mono" style="width:120px;color:var(--fg-mute);">${(b.lo ?? 0).toFixed(2)} → ${(b.hi ?? 0).toFixed(2)}</div><div style="flex:1;height:6px;background:var(--bg);border-radius:99px;overflow:hidden;"><div style="height:100%;width:${max ? (b.count / max * 100) : 0}%;background:var(--grad);"></div></div><div class="mono" style="width:30px;text-align:right;">${b.count}</div></div>`;
  }).join('')}</div>` : '';
  return `<div class="card" style="padding:0;"><div style="display:flex;justify-content:space-around;border-bottom:1px solid var(--border-soft);">${tiles}</div>${histHtml}</div>`;
}

// ---------- Experiences ----------
PAGES.experiences = async (root) => {
  setTitle('Experiences', '已沉淀的经验卡片');
  setActions(`
    <button class="btn ghost" onclick="renderPage('experiences')">↻</button>
    <button class="btn primary" onclick="renderPage('push')">+ Push 一条</button>
  `);
  root.innerHTML = `
    <div class="row-flex" style="margin-bottom:14px;">
      <select class="in" id="exp-status-filter" style="max-width:180px;">
        <option value="">所有 review_status</option>
        <option value="pending">pending</option>
        <option value="approved">approved</option>

async function loadExperiences() {

    const qs = new URLSearchParams({limit: 100});

    if (!rows.length) {
      target.innerHTML = '<div class="card empty"><h3>暂无经验</h3><div style="color:var(--fg-mute);font-size:12px;">点 Dashboard 的"灌入演示数据"或者去 Push 一条试试</div></div>';

            <td>${reviewBadge(r.review_status)}</td>

            <td class="mono">${r.reuse_count || 0}</td>
            <td>${escapeHtml(r.agent_name || '—')}</td>
            <td style="font-size:11px;color:var(--fg-mute);">${fmtTs(r.created_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    `;
  } catch (err) {
    target.innerHTML = `<div class="empty"><h3>加载失败</h3><div>${escapeHtml(err.message)}</div></div>`;
  }

function meanQ(r) {
  const ks = ['q_outcome','q_intent','q_execution','q_orchestration','q_expression'];
  const vs = ks.map(k => r[k]).filter(v => v != null);
  if (!vs.length) return 0;
  return vs.reduce((a,b) => a+b, 0) / vs.length;
}

async function installSkill(name) {
  try {
    const r = await api.get('/skills/' + encodeURIComponent(name) + '/install');
    openModal(`<div class="modal-head"><h2>Bundle · ${escapeHtml(name)}</h2><div class="spacer"></div><button class="btn" onclick="downloadSkill('${escapeHtml(name)}','${escapeHtml(r.bundle_b64)}')">⬇ 下载 .tar.gz</button><button class="btn ghost" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <div class="row-flex" style="margin-bottom:12px;">
          <span class="chip green">sha256 ✓ ${escapeHtml((r.bundle_sha256||'').slice(0,16))}…</span>
          <span class="chip muted">${r.files.length} files</span>
        </div>
        ${r.files.map(f => `<div class="card" style="margin-bottom:10px;"><div class="row-flex" style="margin-bottom:8px;"><span class="mono" style="color:var(--accent);">${escapeHtml(f.path)}</span><span style="color:var(--fg-mute);font-size:11px;">${fmtBytes(f.size)}</span></div><pre class="code" style="max-height:300px;">${escapeHtml(f.content)}</pre></div>`).join('')}
      </div>`);
  } catch (err) { toast('Install 失败: ' + err.message, 'err'); }
}
function downloadSkill(name, b64) {
  const bytes = atob(b64);
  const arr = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
  const blob = new Blob([arr], {type: 'application/gzip'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.tar.gz';
  a.click();
}

          <textarea class="in" id="sk-extras" style="min-height:100px;">snippet.py::import pandas as pd\\n\\ndef topk(df, k=5):\\n    return df.nlargest(k, 'value')</textarea>
          <div class="hint">格式 <span class="mono">path::content</span>，可以多行；每行表示一个文件。content 内的字面量 \\n 会变成换行。</div>
        </div>
        <button class="btn primary" onclick="uploadSkill()" id="sk-up-btn">⬆ 上传 + 入库</button>

async function uploadSkill() {
  const btn = document.getElementById('sk-up-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>建包 + sanitize + 入库中…';
  try {
    const md = document.getElementById('sk-md').value;
    if (!md.trim()) throw new Error('SKILL.md 不能为空');
    const files = [{path: 'SKILL.md', content: md}];
    const extras = document.getElementById('sk-extras').value.split('\n').map(s => s.trim()).filter(Boolean);
    for (const line of extras) {
      const idx = line.indexOf('::');
      if (idx === -1) continue;
      const path = line.slice(0, idx).trim();
      const content = line.slice(idx + 2).replace(/\\n/g, '\n');
      if (path) files.push({path, content});
    }
    const tags = document.getElementById('sk-tags').value.split(',').map(s => s.trim()).filter(Boolean);
    const body = {
      agent_name: document.getElementById('sk-agent').value || 'ui-admin',
      files,
      sensitivity: document.getElementById('sk-sens').value,
      acl: document.getElementById('sk-acl').value,
      tags,
    };
    const r = await api.post('/skills/push-from-files', body);
    toast('Skill 已入库 · sha256 ' + (r.bundle_sha256 || '').slice(0,12), 'ok');
    document.getElementById('sk-up-result').innerHTML = `
      <div class="card">
        <h3>结果</h3>
        <div class="row-flex" style="margin-bottom:8px;">
          ${reviewBadge(r.review_status)}
          <button class="btn" onclick="openSkill('${escapeHtml(r.name)}')">查看 →</button>
        </div>
        <pre class="code">${escapeHtml(JSON.stringify(r, null, 2))}</pre>
      </div>
    `;
  } catch (err) {
    toast('上传失败: ' + err.message, 'err');
    document.getElementById('sk-up-result').innerHTML = `<div class="card empty"><h3 style="color:var(--danger);">失败</h3><div>${escapeHtml(err.message)}</div></div>`;
  } finally {
    btn.disabled = false; btn.innerHTML = '⬆ 上传 + 入库';
  }
}

let currentPage = 'dashboard';
async function renderPage(name) {
  currentPage = name;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  const root = document.getElementById('page-root');
  root.innerHTML = '<div class="empty">loading…</div>';
  const fn = PAGES[name];
  if (!fn) { root.innerHTML = '<div class="empty"><h3>404</h3></div>'; return; }
  try { await fn(root); }
  catch (err) {
    console.error(err);
    root.innerHTML = `<div class="empty"><h3>页面错误</h3><div>${escapeHtml(err.message)}</div></div>`;
  }
}
