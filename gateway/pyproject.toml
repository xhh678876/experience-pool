[project]
name = "experience-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "asyncpg>=0.30",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "structlog>=24.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
