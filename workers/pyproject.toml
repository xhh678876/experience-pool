[project]
name = "experience-workers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "boto3>=1.35",
    "structlog>=24.4",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workers"]
