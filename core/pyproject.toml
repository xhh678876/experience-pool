[project]
name = "exp-core"
version = "0.1.0"
description = "Standalone in-process experience pool. No external infra needed."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
expctl = "exp_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exp_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
