# Sanitizer rules for the four-layer pipeline.
#
# Layer 1 is driven by these rules. Categories with `severity: high` cause
# the experience to be routed to human review (review_status='pending')
# even if Layer 2/3 are clean. Layer 1.5 (OpenAI Privacy Filter) runs
# AFTER these rules and only sees what regex didn't catch.
#
# Each rule may be either a `pattern` (Python re) or a `match` keyword
# (e.g. `luhn` for credit-card validation). The replacement is the literal
# placeholder string. Parity is maintained with dist-public/exp_uploader.py
# so client and server produce equivalent output.

internal_domains:
  # Hostnames whose appearance should be redacted as <INTERNAL_HOST>.
  # Customize these for your org. Subdomains are matched via right-anchored
  # suffix; e.g. "corp.example.com" also matches "build.corp.example.com".
  - corp.example.com
  - internal.example.com
  - eng.example.com
  - intra.example
  - acme-internal.net

employee_id_prefixes:
  # Token prefixes that identify an internal employee ID. Configure per
  # company convention. Match is `<PREFIX>\d{4,8}` case-insensitive.
  - EMP
  - STAFF
  - SJTU

rules:
  # ----- HIGH severity: secrets / keys / private data -----
  # Order matters: we run more specific patterns first so a generic
  # "sk-" rule doesn't gobble an Anthropic key before its dedicated rule.

  - name: pem_private_key
    pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----[\s\S]*?-----END (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'
    placeholder: <PRIVATE_KEY>
    severity: high

  - name: ssh_pubkey
    pattern: 'ssh-(?:rsa|ed25519|dss)\s+[A-Za-z0-9+/=]{80,}'
    placeholder: <SSH_KEY>
    severity: high

  - name: gcp_sa_key
    pattern: '"private_key"\s*:\s*"-----BEGIN[^"]+"'
    placeholder: '"private_key":"<PRIVATE_KEY>"'
    severity: high

  - name: aws_access_key
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    placeholder: <KEY>
    severity: high

  # JWT must run before bearer_token (a JWT often follows "Bearer ").
  - name: jwt
    pattern: '\beyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b'
    placeholder: <JWT>
    severity: high

  - name: bearer_token
    pattern: '(?i)(?:Authorization:\s*Bearer\s+|Bearer\s+)([A-Za-z0-9._\-]{16,})'
    placeholder: 'Bearer <TOKEN>'
    severity: high

  # Vendor-specific keys. The `\b` left anchor prevents accidental matches
  # inside a longer alphanumeric string.

  - name: anthropic_key
    pattern: '\bsk-ant-[A-Za-z0-9_\-]{20,}\b'
    placeholder: <SECRET>
    severity: high

  - name: openai_proj_key
    pattern: '\bsk-proj-[A-Za-z0-9_\-]{20,}\b'
    placeholder: <SECRET>
    severity: high

  - name: openai_key
    # Matches sk-... but must NOT match sk-ant-... or sk-proj-... (handled above).
    pattern: '\bsk-(?!ant-|proj-)[A-Za-z0-9]{20,}\b'
    placeholder: <SECRET>
    severity: high

  - name: xai_key
    pattern: '\bxai-[A-Za-z0-9]{40,}\b'
    placeholder: <SECRET>
    severity: high

  - name: groq_key
    pattern: '\bgsk_[A-Za-z0-9]{40,}\b'
    placeholder: <SECRET>
    severity: high

  - name: google_api_key
    pattern: '\bAIza[0-9A-Za-z_\-]{35}\b'
    placeholder: <SECRET>
    severity: high

  - name: hf_token
    pattern: '\bhf_[A-Za-z0-9]{30,}\b'
    placeholder: <SECRET>
    severity: high

  - name: mimo_token
    pattern: '\btp-[A-Za-z0-9]{30,}\b'
    placeholder: <SECRET>
    severity: high

  - name: stripe_secret
    pattern: '\bsk_(?:live|test)_[0-9a-zA-Z]{16,}\b'
    placeholder: <SECRET>
    severity: high

  - name: stripe_publishable
    pattern: '\bpk_(?:live|test)_[0-9a-zA-Z]{16,}\b'
    placeholder: <SECRET>
    severity: high

  - name: github_token
    pattern: '\bgh[pousr]_[0-9a-zA-Z]{20,}\b'
    placeholder: <SECRET>
    severity: high

  - name: gitlab_token
    pattern: '\bglpat-[0-9a-zA-Z_\-]{20,}\b'
    placeholder: <SECRET>
    severity: high

  - name: npm_token
    pattern: '\bnpm_[A-Za-z0-9]{30,}\b'
    placeholder: <SECRET>
    severity: high

  - name: vercel_token
    pattern: '\b(?:vercel|vc)_[A-Za-z0-9]{20,}\b'
    placeholder: <SECRET>
    severity: high

  - name: supabase_token
    pattern: '\bsbp_[A-Za-z0-9]{30,}\b'
    placeholder: <SECRET>
    severity: high

  - name: cloudflare_token
    pattern: '\bcfk_[A-Za-z0-9_\-]{30,}\b'
    placeholder: <SECRET>
    severity: high

  - name: sentry_dsn
    pattern: '\bsntrys_[A-Za-z0-9_\-]{30,}\b'
    placeholder: <SECRET>
    severity: high

  - name: slack_token
    pattern: '\bxox[baprs]-[A-Za-z0-9\-]{10,}\b'
    placeholder: <SECRET>
    severity: high

  # Generic credential assignment: api_key="abc...", password=xyz, etc.
  - name: generic_api_key
    pattern: '(?i)(api[_-]?key|access[_-]?token|secret[_-]?key|client[_-]?secret|password|passwd|pwd)\s*[:=]\s*["'']?([A-Za-z0-9_\-]{16,})["'']?'
    placeholder: '\1=<SECRET>'
    severity: high

  # url_with_credentials must match before db_uri so credentialled forms
  # produce the readable "<scheme>://<USER>:<PASS>@host" output.
  - name: url_with_credentials
    pattern: '\b(https?|ftp|ssh|sftp|postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp)://([^\s/:@]+):([^\s/@]+)@'
    placeholder: '\1://<USER>:<PASS>@'
    severity: high

  - name: db_uri
    pattern: '\b(postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp|clickhouse)://[^\s"''<>]+'
    placeholder: '\1://<DB_URI>'
    severity: high

  - name: idcard_cn
    pattern: '(?<![\w\d])[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx](?![\w\d])'
    placeholder: <ID_CARD>
    severity: high

  # Credit cards run before phone so a 16-digit Luhn-valid number isn't
  # eaten by the permissive phone regex.
  - name: credit_card
    match: luhn
    placeholder: <CARD>
    severity: high

  # ----- MEDIUM severity: PII -----

  - name: email
    pattern: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    placeholder: <EMAIL>
    severity: medium

  # phone_intl matches international-format numbers.
  - name: phone_intl
    pattern: '(?<![\w@\d])\+\d{1,3}[\s.\-]?\d{2,4}[\s.\-]?\d{3,4}[\s.\-]?\d{3,4}\b'
    placeholder: <PHONE>
    severity: medium
    min_digits: 10

  # phone_cn matches Chinese mobile numbers (with or without +86 prefix).
  - name: phone_cn
    pattern: '(?<![\w@\d])(?:\+?86[\s\-]?)?1[3-9]\d{9}\b'
    placeholder: <PHONE>
    severity: medium

  # ----- LOW severity: network identifiers / paths -----

  - name: ipv4
    pattern: '\b(?:(?:25[0-5]|2[0-4]\d|[01]?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|[01]?\d?\d)\b'
    placeholder: <IP>
    severity: low

  - name: ipv6
    pattern: '\b(?:[A-Fa-f0-9]{1,4}:){7}[A-Fa-f0-9]{1,4}\b'
    placeholder: <IP>
    severity: low

  # Strip /Users/<USER>/ and /home/<USER>/ down to <HOMEDIR>/ so absolute
  # paths can't be used to fingerprint a specific machine/operator.
  - name: home_path
    pattern: '/(?:Users|home)/[^/\s''"]+/'
    placeholder: '<HOMEDIR>/'
    severity: low
